services:
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    depends_on:
      redpanda-init:
        condition: service_completed_successfully   # топик уже существует до подписки MV
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query='SELECT 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --set
      - redpanda.auto_create_topics_enabled=false   # ← без авто-создания: ранний produce упадёт, а не создаст топик с 1 партицией
    ports:
      - "19092:19092"
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster info --brokers localhost:9092 >/dev/null 2>&1 || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 40s     # даём брокеру время до первой засчитываемой проверки

  redpanda-init:
    image: redpandadata/redpanda:latest
    container_name: redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rpk topic describe events --brokers redpanda:9092 >/dev/null 2>&1
        || rpk topic create events -p 3 --brokers redpanda:9092
    restart: "no"        # one-shot: идемпотентно создать топик и выйти; реальная ошибка create → ненулевой код

  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092

  aiohttp_app:
    container_name: aiohttp_app
    build: .
    depends_on:
      clickhouse:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully   # ← явная гарантия: топик с 3 партициями готов до первого produce
    ports:
      - "8080:8080"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_EVENTS_TOPIC: events
    volumes:
      - .:/app

  worker:
    container_name: worker
    build: .
    command: ["python", "worker/worker.py"]
    depends_on:
      clickhouse:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_NATIVE_PORT: 9000
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
    volumes:
      - .:/app

volumes:
  clickhouse-data: